# Minimal project config; `supabase init` defaults apply to everything omitted.
project_id = "tekrar"

[api]
schemas = ["public"]

[db]
major_version = 15

[functions.daily-checkin]
verify_jwt = true

[functions.ingest-syllabus]
verify_jwt = true

[functions.generate-weekly-plan]
verify_jwt = true

[functions.llm-models]
verify_jwt = true

# Called by the Focus Timer app, which has no Supabase session: the function
# checks its own pairing token (x-timer-token) instead.
[functions.focus-timer]
verify_jwt = false
